name: Python

on:
  push:
    paths: ["src/**", "tests/**", "testdata/**", "pyproject.toml", ".github/workflows/python.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "testdata/**", "pyproject.toml", ".github/workflows/python.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - name: Import without the optional extras
        run: python -c "import pizzetti; print(pizzetti.__version__)"
      # setuptools provides distutils, which batman imports, on Python >= 3.12
      - run: pip install -e ".[fit]" pytest mpmath batman-package setuptools
      - run: pytest -q tests
